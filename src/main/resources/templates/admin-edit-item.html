<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
<main class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 border p-4 shadow-sm bg-light">
      <h2 class="mb-4">Update item</h2>

      <form th:action="@{/web/admin/items/{id}/update(id=${itemId})}"
            th:object="${updateItemRequest}"
            enctype="multipart/form-data"
            method="post">
        <div class="mb-3">
          <label for="category" class="form-label">Category</label>
          <select th:field="*{category}" id="category" class="form-select"
                  onchange="filterSubCategories()">
            <option value="">-- Select Category --</option>
            <option
                th:each="cat : ${T(se.jensen.johanna.auctionsite.model.enums.Category).values()}"
                th:value="${cat}"
                th:text="${cat}">
            </option>
          </select>
          <div class="text-danger" th:if="${#fields.hasErrors('category')}"
               th:errors="*{category}"></div>
        </div>
        <div class="mb-3">
          <label for="subCategory" class="form-label">Subcategory</label>
          <select th:field="*{subCategory}" id="subCategory" class="form-select">
            <option value="">Select Subcategory</option>
            <option
                th:each="sub : ${T(se.jensen.johanna.auctionsite.model.enums.Category.SubCategory).values()}"
                th:value="${sub}"
                th:text="${sub}"
                th:data-parent="${sub.getCategory()}">
            </option>
          </select>
        </div>

        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" id="title" th:field="*{title}" class="form-control" required>
          <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" th:field="*{description}" class="form-control"
                    rows="4"></textarea>
          <div class="text-danger" th:if="${#fields.hasErrors('description')}"
               th:errors="*{description}"></div>
        </div>

        <div class="mb-3">
          <label for="valuation" class="form-label">Valuation (EUR)</label>
          <input type="number" id="valuation" th:field="*{valuation}" class="form-control">
          <div class="text-danger" th:if="${#fields.hasErrors('valuation')}"
               th:errors="*{valuation}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Current Images</label>
          <div class="d-flex gap-2 flex-wrap border p-2 bg-white rounded">
            <div th:each="url, iter : *{imageUrls}" class="position-relative">
              <img alt="item-image" th:src="${url}" class="img-thumbnail"
                   style="width: 100px; height: 100px; object-fit: cover;">
              <input type="hidden" th:field="*{imageUrls[__${iter.index}__]}">
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="imageFiles" class="form-label fw-bold">Add New Images</label>
          <input type="file" id="imageFiles" th:field="*{imageFiles}" class="form-control" multiple
                 accept="image/*">
          <div class="form-text text-muted">Välj en eller flera bilder att lägga till.</div>
        </div>


        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">Spara ändringar</button>
          <a th:href="@{/web/admin/items/{id}(id=${itemId})}" class="btn btn-outline-secondary">Avbryt</a>
        </div>
      </form>
    </div>
  </div>
</main>
<script>
  function filterSubCategories() {
    const selectedCategory = document.getElementById('category').value;
    const subSelect = document.getElementById('subCategory');
    const options = subSelect.options;

    for (let i = 0; i < options.length; i++) {
      const option = options[i];
      const parentCat = option.getAttribute('data-parent');

      if (!parentCat) {
        option.hidden = false;
        continue;
      }

      if (parentCat === selectedCategory) {
        option.hidden = false;
        option.disabled = false;
      } else {
        option.hidden = true;
        option.disabled = true;
      }
    }
  }

  // Kör även filter-funktionen när sidan laddas (om en kategori redan är vald vid t.ex. valideringsfel)
  document.addEventListener("DOMContentLoaded", filterSubCategories);
</script>
</body>
</html>
