<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin - All Auctions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Auctions Management</h2>
  <a th:href="@{/web/admin/auctions/launch}" class="btn btn-success">Launch Batch</a>
</div>

<table class="table table-striped table-hover shadow-sm">
  <thead class="table-dark">
  <tr>
    <th>ID</th>
    <th>Title</th>
    <th>Status</th>
    <th>Start Time</th>
    <th>End Time</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="a : ${auctions.content}">
    <td th:text="${a.auctionId}">1</td>
    <td th:text="${a.adminItemResponse?.title ?: 'No Title'}">Item Title</td>
    <td>
      <span class="badge"
            th:classappend="${a.status.name() == 'ACTIVE' ? 'bg-success' : 'bg-secondary'}"
            th:text="${a.status}">STATUS</span>
    </td>

    <td th:text="${a.startTime != null ? #temporals.format(a.startTime.atZone(T(java.time.ZoneId).of('Europe/Stockholm')), 'yyyy-MM-dd HH:mm') : 'Not Started'}">
      Start
    </td>

    <td th:text="${a.endTime != null ? #temporals.format(a.endTime.atZone(T(java.time.ZoneId).of('Europe/Stockholm')), 'yyyy-MM-dd HH:mm') : 'Not Set'}">
      End
    </td>

    <td>
      <div class="d-flex gap-2">
        <a th:href="@{/web/admin/auctions/{id}(id=${a.auctionId})}"
           class="btn btn-sm btn-outline-primary">Details</a>

        <a th:if="${a.startTime == null}"
           th:href="@{/web/admin/auctions/launch}"
           class="btn btn-sm btn-success">Launch</a>
      </div>
    </td>
  </tr>
  </tbody>
</table>

<div th:if="${auctions.totalPages > 1}" class="mt-3">
  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${auctions.first ? 'disabled' : ''}">
        <a class="page-link"
           th:href="@{/web/admin/auctions(page=${auctions.number - 1})}">Previous</a>
      </li>
      <li class="page-item disabled">
        <span class="page-link"
              th:text="'Page ' + (${auctions.number} + 1) + ' of ' + ${auctions.totalPages}">Page 1 of 5</span>
      </li>
      <li class="page-item" th:classappend="${auctions.last ? 'disabled' : ''}">
        <a class="page-link" th:href="@{/web/admin/auctions(page=${auctions.number + 1})}">Next</a>
      </li>
    </ul>
  </nav>
</div>

</body>
</html>
