<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bautasten Auctions</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<main class="container mt-5">
  <div class="row">
    <div class="col-12">

      <p class="text-muted">
        <span th:text="${auction.adminItemResponse.category}">Category</span> /
        <span th:text="${auction.adminItemResponse.subCategory}">Subcategory</span>
      </p>

      <h1 class="display-4" th:text="${auction.adminItemResponse.title}">Item Title</h1>
      <hr>

      <p><strong>Status:</strong> <span class="badge bg-info"
                                        th:text="${auction.status}">STATUS</span></p>
      <p><strong>Auction ID:</strong> <span th:text="${auction.auctionId}">0</span></p>
      <p><strong>Item ID:</strong> <span th:text="${auction.adminItemResponse.itemId}">0</span></p>

      <p th:text="${auction.adminItemResponse.description}">Description</p>

      <div class="bg-light p-3 rounded mb-4">
        <p><strong>Valuation:</strong> <span
            th:text="${auction.adminItemResponse.valuation}">0</span>€</p>
        <p><strong>Accepted Price:</strong> <span th:text="${auction.acceptedPrice}">0</span>€</p>
      </div>

      <div class="row mt-4">
        <div class="col-6 col-md-3 mb-3" th:each="url : ${auction.adminItemResponse.imageUrls}">
          <div class="card shadow-sm">
            <img th:src="${url}" class="img-fluid rounded" alt="Auction Image">
          </div>
        </div>
      </div>

      <p class="mt-4"><strong>Seller ID:</strong> <span
          th:text="${auction.adminItemResponse.sellerId}">0</span></p>
    </div>
  </div>
</main>

</body>
</html>
