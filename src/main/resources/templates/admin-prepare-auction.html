<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bautasten Auctions</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<main class="container mt-5">
  <h2>Create Auction for Item ID: <span th:text="${itemId}">123</span></h2>

  <form th:action="@{/web/admin/items/{itemId}/auctions(itemId=${itemId})}" method="post">

    <div class="mb-3">
      <label class="form-label">Accepted Price</label>
      <input type="number" name="acceptedPrice" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary">Prepare Auction</button>
    <a th:href="@{/web/admin/items}" class="btn btn-secondary">Cancel</a>
  </form>
</main>
</body>
</html>
