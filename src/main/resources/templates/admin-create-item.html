<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bautasten Auctions</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<main class="bg-light p-5 container  m-5 mt-5">
  <div class="d-flex flex-column  align-items-center">
    <div class="col-md-6">
  <h2 class="mb-3">Create Item</h2>
  <form th:action="@{/web/admin/items/create}" th:object="${createItemRequest}" method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label th:class="text-muted" for="sellerId" class="form-label">Seller Id:</label>
      <input type="number" th:field="*{sellerId}" id="sellerId" name="seller-id"
             class="form-control" required>
      <div class="text-danger" th:if="${#fields.hasErrors('sellerId')}"
           th:errors="*{sellerId}"></div>
    </div>
    <div class="mb-3"><label for="title" class="form-label">Item Title:</label>
      <input type="text" id="title" th:field="*{title}" class="form-control">
      <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
    </div>
    <div class="mb-3">
      <label for="description" class="form-label">Item Description:</label>
      <textarea id="description" th:field="*{description}" class="form-control"></textarea>
      <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    </div>
    <div class="mb-3">
      <label for="category" class="form-label">Category</label>
      <select th:field="*{category}" id="category" class="form-select" onchange="filterSubCategories()">
        <option value="">-- Select Category --</option>
        <option th:each="cat : ${T(se.jensen.johanna.auctionsite.model.enums.Category).values()}"
                th:value="${cat}"
                th:text="${cat}">
        </option>
      </select>
      <div class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
    </div>
    <div class="mb-3">
      <label for="subCategory" class="form-label">Subcategory</label>
      <select th:field="*{subCategory}" id="subCategory" class="form-select">
        <option value="">Select Subcategory</option>
        <option th:each="sub : ${T(se.jensen.johanna.auctionsite.model.enums.Category.SubCategory).values()}"
                th:value="${sub}"
                th:text="${sub}"
                th:data-parent="${sub.getCategory()}">
    </select>
  </div>
  <div class="mb-3">
    <label for="valuation" class="form-label">Item Valuation:</label>
    <input type="number" id="valuation" th:field="*{valuation}" class="form-control">
    <div class="text-danger" th:if="${#fields.hasErrors('valuation')}" th:errors="*{valuation}"></div>
  </div>
  <div class="mb-3">
    <label for="imageFiles" class="form-label">Images:</label>
    <input type="file" id="imageFiles" name="imageFiles" class="form-control" multiple accept="image/*">
  </div>
  <button type="submit" class="btn btn-primary">Create Item & Draft Auction</button>
</form>
    </div>
  </div>

</main>

<script>
  function filterSubCategories() {
    const selectedCategory = document.getElementById('category').value;
    const subSelect = document.getElementById('subCategory');
    const options = subSelect.options;

    subSelect.value = "";

    for (let i = 0; i < options.length; i++) {
      const option = options[i];
      const parentCat = option.getAttribute('data-parent');

      if (!parentCat) {
        option.hidden = false;
        continue;
      }

      if (parentCat === selectedCategory) {
        option.hidden = false;
        option.disabled = false;
      } else {
        option.hidden = true;
        option.disabled = true;
      }
    }
  }

  // Kör även filter-funktionen när sidan laddas (om en kategori redan är vald vid t.ex. valideringsfel)
  document.addEventListener("DOMContentLoaded", filterSubCategories);
</script>
</body>
</html>
