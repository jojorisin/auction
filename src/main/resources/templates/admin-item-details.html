<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bautasten Auctions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<main>
  <div class="bg-light p-5 d-flex flex-column align-items-center mt-5 text-start">
    <div class="text-start">
      <h1 th:text="${item.title}">Item Details</h1>
      <p th:text="${item.itemId()}"></p>
      <p th:text="${item.status()}"></p>
      <p><span th:text="${item.category()}"></span>
        <span> / </span>
        <span th:text="${item.subCategory()}"></span>
      </p>

      <p th:text="${item.description()}"></p>
      <p th:text="${item.valuation()}"></p>
      <p th:text="${item.sellerId()}"></p>
      <div class="mt-4 border-top pt-3">
        <h5 class="mb-3">Åtgärder</h5>
        <a th:href="@{/web/admin/items/{itemId}/auctions(itemId=${item.itemId()})}"
           class="btn btn-success">
          Prepare for auction
        </a>

        <a th:href="@{/web/admin/items/create}" class="btn btn-outline-secondary">
          Add new item
        </a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
