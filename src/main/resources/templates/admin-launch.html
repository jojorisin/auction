<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bautasten Auctions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<form th:action="@{/web/admin/auctions/launch}"
      th:object="${launchRequest}"
      method="post">

  <div class="mb-3">
    <label for="size" class="form-label">Antal objekt (Batch size)</label>
    <input type="number" id="size" th:field="*{size}" class="form-control">
  </div>

  <div class="row mb-3">
    <div class="col">
      <label for="startDate" class="form-label">Startdatum</label>
      <input type="date" id="startDate" th:field="*{startDate}" class="form-control" required>
    </div>
    <div class="col">
      <label for="startTime" class="form-label">Starttid</label>
      <input type="time" id="startTime" th:field="*{startTime}" class="form-control" step="60"
             required>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col">
      <label for="endDate" class="form-label">Slutdatum</label>
      <input type="date" id="endDate" th:field="*{endDate}" class="form-control" required>
    </div>
    <div class="col">
      <label for="endTime" class="form-label">Sluttid</label>
      <input type="time" id="endTime" th:field="*{endTime}" class="form-control" step="60" required>
    </div>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-success">Launch</button>
    <a th:href="@{/web/admin/auctions}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</body>
</html>
