<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bautasten Auctions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<main>
  <p>Visar <span th:text="${auctions.numberOfElements}">0</span> av totalt <span th:text="${auctions.totalElements}">0</span> auktioner.</p>
  <div th:if="${auctions.isEmpty()}">
    <p>Just nu finns inga aktiva auktioner.</p>
  </div>
  <div th:each="a : ${auctions.content}">
    <h2 th:text="${a.title}"></h2>
    <p th:text="${a.highestBid}"></p>
  </div>
</main>

</body>
</html>
