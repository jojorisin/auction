<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bautasten Auctions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<main>
  <nav class="mb-4">
    <div class="d-flex flex-wrap gap-2 p-5">
      <a th:href="@{/web/auctions}"
         class="btn btn-sm"
         th:classappend="${selectedCategory == null ? 'btn-primary' : 'btn-outline-primary'}">
        All Categories
      </a>

      <a th:each="cat : ${categories}"
         th:href="@{/web/auctions(category=${cat})}"
         th:text="${cat}"
         class="btn btn-sm"
         th:classappend="${selectedCategory == cat ? 'btn-primary' : 'btn-outline-primary'}">
        Category Name
      </a>
    </div>
  </nav>

  <hr>

  <div th:if="${auctions.isEmpty()}" class="alert alert-info">
    <p>No active auctions found for this category.</p>
  </div>
  <div th:if="${auctions.isEmpty()}">
    <p>Just nu finns inga aktiva auktioner.</p>
  </div>
  <div class="container">
    <div class="dt-row justify-content-center">
      <div class="justify-content-center" th:each="a : ${auctions.content}">
        <h2 th:text="${a.title}"></h2>
        <div th:if="${a.highestBid==0}">
          <p class="text-muted small mb-0">Valuation</p>
          <p th:text="${a.valuation}"></p>
        </div>
        <div th:if="${a.highestBid>0}">
          <p class="text-muted small mb-0">Current bid</p>
          <p th:text="${a.highestBid}"></p>
        </div>

      </div>
    </div>
  </div>
</main>

</body>
</html>
